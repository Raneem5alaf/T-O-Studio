<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Shutter Icon (Vibrant Royal Blue & Indigo) -->
  <g transform="translate(10, 5)">
    <!-- Outer thin accent circle -->
    <circle cx="25" cy="25" r="23" stroke="#E4E4E7" stroke-width="1.5" />
    <circle cx="25" cy="25" r="20" stroke="#2563EB" stroke-width="2.5" />
    
    <!-- Modern camera shutter blades geometry -->
    <path d="M 25 5 C 32 5, 38 10, 40 17 L 31 20 C 30 16, 28 14, 25 14 Z" fill="#2563EB" />
    <path d="M 45 25 C 45 32, 40 38, 33 40 L 30 31 C 34 30, 36 28, 36 25 Z" fill="#3B82F6" />
    <path d="M 25 45 C 18 45, 12 40, 10 33 L 19 30 C 20 34, 22 36, 25 36 Z" fill="#60A5FA" />
    <path d="M 5 25 C 5 18, 10 12, 17 10 L 20 19 C 16 20, 14 22, 14 25 Z" fill="#1D4ED8" />
    
    <!-- Center aperture -->
    <circle cx="25" cy="25" r="4.5" fill="#2563EB" />
    <circle cx="25" cy="25" r="1.5" fill="#FFFFFF" />
  </g>
  
  <!-- Arabic / English Premium Typography -->
  <text x="72" y="31" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="19" font-weight="800" fill="#09090B" letter-spacing="0.5">تـو استوديو</text>
  <text x="73" y="47" font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" font-size="10.5" font-weight="700" fill="#2563EB" letter-spacing="3.5">TO STUDIO</text>
</svg>
