<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Shutter Icon (Vibrant Royal Blue & Indigo) centered at (80, 50) -->
  <g transform="translate(55, 10)">
    <!-- Outer thin accent circle -->
    <circle cx="25" cy="25" r="23" stroke="#E4E4E7" stroke-width="1.5" />
    <circle cx="25" cy="25" r="20" stroke="#2563EB" stroke-width="2.5" />
    
    <!-- Modern camera shutter blades geometry -->
    <path d="M 25 5 C 32 5, 38 10, 40 17 L 31 20 C 30 16, 28 14, 25 14 Z" fill="#2563EB" />
    <path d="M 45 25 C 45 32, 40 38, 33 40 L 30 31 C 34 30, 36 28, 36 25 Z" fill="#3B82F6" />
    <path d="M 25 45 C 18 45, 12 40, 10 33 L 19 30 C 20 34, 22 36, 25 36 Z" fill="#60A5FA" />
    <path d="M 5 25 C 5 18, 10 12, 17 10 L 20 19 C 16 20, 14 22, 14 25 Z" fill="#1D4ED8" />
    
    <!-- Center aperture -->
    <circle cx="25" cy="25" r="4.5" fill="#2563EB" />
    <circle cx="25" cy="25" r="1.5" fill="#FFFFFF" />
  </g>
  
  <!-- Centered Arabic & English Premium Typography -->
  <text x="80" y="92" font-family="system-ui, -apple-system, 'SF Pro Display', sans-serif" font-size="24" font-weight="900" fill="#09090B" text-anchor="middle" letter-spacing="1">تـو استوديو</text>
  <text x="80" y="112" font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle" letter-spacing="4.5">TO STUDIO</text>
  <text x="80" y="132" font-family="system-ui, -apple-system, 'SF Pro Text', sans-serif" font-size="9" font-weight="600" fill="#A1A1AA" text-anchor="middle" letter-spacing="6">TAIF</text>
</svg>
